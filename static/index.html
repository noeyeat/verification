<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TaskBoard</title>
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header>
    <h1>
      <span aria-hidden="true">📋</span>
      TaskBoard
    </h1>
    <p class="tagline" id="app-identity">Demo task list for verification</p>
    <nav aria-label="Primary">
      <button type="button" id="nav-home" aria-current="page">Home</button>
      <button type="button" id="nav-new">New task</button>
      <button type="button" id="nav-search">Search</button>
    </nav>
  </header>

  <main id="main">
    <section id="view-home" aria-labelledby="home-heading">
      <h2 id="home-heading">All tasks</h2>
      <p id="home-status" role="status" aria-live="polite"></p>
      <ul id="task-list" aria-label="Task list"></ul>
    </section>

    <section id="view-create" hidden aria-labelledby="create-heading">
      <h2 id="create-heading">New task</h2>
      <form id="create-form" aria-label="Task editor">
        <label for="task-title">Title</label>
        <input id="task-title" name="title" type="text" autocomplete="off" required />
        <label for="task-body">Body</label>
        <textarea id="task-body" name="body" rows="4"></textarea>
        <div class="actions">
          <button type="submit" id="save-task">Save task</button>
          <button type="button" id="cancel-create">Cancel</button>
        </div>
      </form>
      <p id="create-status" role="status" aria-live="polite"></p>
    </section>

    <section id="view-search" hidden aria-labelledby="search-heading">
      <h2 id="search-heading">Search tasks</h2>
      <label for="search-input">Search tasks</label>
      <input id="search-input" type="search" role="searchbox" aria-label="Search tasks" autocomplete="off" />
      <button type="button" id="clear-search">Clear search</button>
      <p id="search-status" role="status" aria-live="polite"></p>
      <ul id="search-results" aria-label="Search results"></ul>
    </section>

    <section id="view-detail" hidden aria-labelledby="detail-heading">
      <h2 id="detail-heading">Task</h2>
      <article aria-label="Task detail">
        <h3 id="detail-title"></h3>
        <p id="detail-body"></p>
        <p id="detail-meta" class="meta"></p>
      </article>
      <button type="button" id="back-home">Back to all tasks</button>
    </section>
  </main>

  <footer>
    <small id="build-label"></small>
  </footer>
  <script src="/app.js"></script>
</body>
</html>
